<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Hostels Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i data-lucide="building-2"></i> Campus Rooms
    </a>
    <a href="manager.html" class="nav-btn">Manager Portal</a>
  </header>

  <main class="container">
    <!-- SMART BUDGET RECOMMENDATION SEARCH -->
    <div class="filter-card">
      <h3 style="margin-bottom: 1rem; font-size: 1.1rem; color: var(--primary);">
        🎯 Find Hostels Within Your Budget
      </h3>
      <div class="filter-grid">
        <div class="form-group">
          <label>Max Budget ($/yr)</label>
          <input type="number" id="budgetInput" class="form-control" placeholder="e.g. 1500" />
        </div>
        <div class="form-group">
          <label>Your College</label>
          <select id="budgetCollege" class="form-control">
            <option value="ALL">All Colleges</option>
            <option value="Science">Science</option>
            <option value="Business">Business</option>
            <option value="Engineering">Engineering</option>
            <option value="Arts & Social Sciences">Arts & Social Sciences</option>
            <option value="Health Sciences">Health Sciences</option>
          </select>
        </div>
        <div class="form-group">
          <label>Room Preference</label>
          <select id="budgetRoomType" class="form-control">
            <option value="ALL">Any Room Type</option>
            <option value="1-in-1">1-in-1</option>
            <option value="2-in-1">2-in-1</option>
            <option value="3-in-1">3-in-1</option>
            <option value="4-in-1">4-in-1</option>
          </select>
        </div>
        <button onclick="runBudgetRecommendation()" class="btn-search">Match Budget</button>
      </div>
    </div>

    <!-- HOSTELS CONTAINER GRID -->
    <div id="hostelsGrid" class="hostels-grid">
      <!-- Populated dynamically via js/app.js -->
    </div>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
